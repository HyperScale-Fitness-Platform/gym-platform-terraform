apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-duckdns-solver
rules:
  - apiGroups:
      - "acme.iti-gym-platform.duckdns.org"
    resources:
      - "*"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-duckdns-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-duckdns-solver
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-duckdns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${email}
    privateKeySecretRef:
      name: letsencrypt-duckdns-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.iti-gym-platform.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: duckdns-token
                key: token
